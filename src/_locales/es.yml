# Spanish locale data, auto-loaded into I18n by Site::Localizable.
# Date vocabulary plus the AI Watchdog ticker strings (`ai_watchdog`), read
# via the `t` helper in src/_components/shared/ai_watchdog.erb — the live API
# fetch in frontend/javascript/index.js reuses the same strings from data
# attributes so no language is hardcoded outside this file. Formats use
# strftime directives; %A and %B are swapped for the names below by I18n, not
# by Ruby.
es:
  date:
    formats:
      default: "%d/%m/%Y"
      short: "%-d de %B de %Y"
      long: "%A, %-d de %B de %Y"

    day_names: [domingo, lunes, martes, miércoles, jueves, viernes, sábado]
    abbr_day_names: [dom, lun, mar, mié, jue, vie, sáb]

    # Don't forget the nil at the beginning; there's no such thing as a 0th month
    month_names: [~, enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre]
    abbr_month_names: [~, ene, feb, mar, abr, may, jun, jul, ago, sep, oct, nov, dic]
    order:
      - year
      - month
      - day

  # Post and edition dates are Time objects, so I18n resolves them against
  # `time.formats`, not `date.formats`. Nothing on the site renders a clock
  # time, so both namespaces carry the same date-only patterns.
  time:
    formats:
      default: "%A, %-d de %B de %Y"
      short: "%-d de %B de %Y"
      long: "%A, %-d de %B de %Y"
    am: "am"
    pm: "pm"

  # Live release tracker under the masthead. The brand is a proper noun and
  # stays in English; the ticker reads "Último: <modelo> · hace 2 días",
  # "Media: 1,9 días". The JS only reads these strings from data attributes,
  # never prose from markup.
  ai_watchdog:
    brand: "AI Watchdog"
    brand_link: "Ver historias de lanzamientos de IA"
    live: "live"
    fallback: "Seguimiento de lanzamientos en"
    latest: "Último"
    average_label: "Media"
    since:
      today: "hoy"
      one: "hace 1 día"
      other: "hace %{count} días"
    average:
      one: "%{avg} día"
      other: "%{avg} días"
    link_title: "Ver %{name} en models.dev"
    radar:
      toggle: "Radar"
      close: "Cerrar radar"
      title: "Últimos lanzamientos"
      updated: "Actualizado %{date}"

  # Layout-integrated search (Pagefind, no dedicated page). All visible words
  # come from here: the erb renders them into data attributes and the JS in
  # frontend/javascript/index.js only reads those attributes, never prose.
  search:
    toggle: "Buscar"
    label: "Buscar en el archivo"
    placeholder: "Buscar historias…"
    clear: "Limpiar"
    close: "Cerrar búsqueda"
    hint: "Escribe para buscar en todas las historias."
    too_short: "Escribe al menos 2 letras."
    loading: "Buscando…"
    error: "La búsqueda no está disponible ahora mismo."
    results:
      one: "1 historia"
      other: "%{count} historias"
    no_results: "Sin resultados para “%{query}”."
